[project]
name = "invoice-ai-fde"
version = "0.1.0"
description = "Invoice extraction, validation, human review, evaluation and accounting integration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.1",
  "pymupdf>=1.24.0",
  "pillow>=10.4.0",
  "pytesseract>=0.3.13",
  "groq>=0.11.0",
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
  "python-dotenv>=1.0.1",
  "python-dateutil>=2.9.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-cov>=5.0.0", "ruff>=0.6.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "frontend*", "tests*"]